name: Generate outputs

on:
  push:
    branches: 
      - main
      - Filip-Rework

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: Jotun_cycle.py -t cycle.txt -j cycle.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: generated-outputs
          path: output/
